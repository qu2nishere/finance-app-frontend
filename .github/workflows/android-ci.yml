# CI Android: unit test + build APK debug + lint tren may Ubuntu sach moi lan co PR / push.
# Runner ubuntu-latest co san Android SDK (ANDROID_HOME) nen khong can local.properties.
name: android-ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # AGP 9 / Gradle 9 can JDK >= 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit test
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Lint chi lam CI do khi co loi muc Error; canh bao (Warning) chi nam trong bao cao.
      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
